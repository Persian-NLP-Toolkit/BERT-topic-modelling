name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- CI ----
  python:
    name: Python ${{ matrix.python }} (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Black
        run: black --check .
      - name: Pytest
        run: pytest -q
      - name: CLI smoke test
        run: |
          bert-wordcloud --version
          bert-wordcloud generate examples/sample.csv -o wordclouds/sample.png --top 10
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: sample-wordcloud
          path: wordclouds/sample.png

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------------------------------------------------------------- CD ----
  docker:
    name: Docker image (${{ matrix.variant }})
    needs: [python, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lite
            extras: ""
            suffix: ""
          - variant: bertopic
            extras: bertopic
            suffix: "-bertopic"
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: EXTRAS=${{ matrix.extras }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test the image
        if: matrix.variant == 'lite'
        run: |
          docker buildx build --load -t wordcloud:test --build-arg EXTRAS= \
            --cache-from type=gha,scope=lite .
          docker run -d --name wc -p 8000:8000 wordcloud:test
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fs -F file=@examples/sample.csv http://127.0.0.1:8000/api/wordcloud | head -c 300
          curl -fs http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker rm -f wc

  release:
    name: GitHub release (CLI wheel)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend into the package
        run: |
          cd frontend && npm ci && npm run build && cd ..
          rm -rf bert_wordcloud/static && cp -r frontend/dist bert_wordcloud/static
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
