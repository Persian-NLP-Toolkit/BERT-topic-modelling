[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bert-wordcloud"
version = "0.2.0"
description = "Persian word clouds from text files, with optional BERTopic + ParsBERT topic weighting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "wordcloud>=1.9",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
bertopic = [
    "torch>=2.0",
    "transformers>=4.38",
    "bertopic>=0.16",
    "umap-learn>=0.5",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "black>=24",
]

[project.scripts]
bert-wordcloud = "bert_wordcloud.cli:main"

[tool.setuptools.packages.find]
include = ["bert_wordcloud*"]

[tool.setuptools.package-data]
bert_wordcloud = ["fonts/*.ttf", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
